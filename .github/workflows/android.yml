name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (secret GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "GYMTRACKER_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets SIGNING_KEYSTORE_BASE64 / SIGNING_PASSWORD absents : APK signé avec une clé temporaire, il ne pourra pas s'installer par-dessus la version précédente."
          fi

      - name: Build debug APK
        env:
          GYMTRACKER_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GymTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
